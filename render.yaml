services:
  - type: web
    name: llm-recruitment-tool
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: chainlit run backend/app.py --host 0.0.0.0 --port $PORT --headless
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_LLM_MODEL
        value: gemini-3.1-flash-lite-preview
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: GCS_BUCKET_NAME
        value: iradini-jobs-chroma
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcs-service-account.json
      - key: PYTHONUNBUFFERED
        value: "1"
    # Secret Files aren't part of the Blueprint spec - add this manually in
    # the dashboard: Environment tab -> Secret Files -> path
    # /etc/secrets/gcs-service-account.json -> paste the service account
    # JSON key contents. Downloads chroma/ from GCS_BUCKET_NAME at startup
    # if not already present locally (see backend/retriever.py).
